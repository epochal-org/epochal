name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml, .github/scripts/release-notes.sh, CHANGELOG.md]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          PUBLISH: ${{ vars.RELEASE_PUBLISH == 'true' && github.ref_type == 'tag' }}
        run: |
          version=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "epochal-cli") | .version')
          for pyproject in python/*/pyproject.toml; do
            py=v$(grep -m1 '^version = ' "$pyproject" | cut -d'"' -f2)
            if [[ "$py" != "$version" ]]; then
              echo "$pyproject has $py, the crates have $version"
              exit 1
            fi
          done
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Release $version: publish=$PUBLISH" >> "$GITHUB_STEP_SUMMARY"
      - run: .github/scripts/release-notes.sh "${{ steps.plan.outputs.version }}" | tee notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: notes.md

  binaries:
    name: binaries (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET" -p epochal-cli -p epochal-mcp
      - name: Package
        run: |
          mkdir dist
          for bin in epochal epochal-mcp; do
            name="$bin-$VERSION-$TARGET"
            mkdir "$name"
            cp LICENSE "$name/"
            if [[ "$TARGET" == *windows* ]]; then
              cp "target/$TARGET/release/$bin.exe" "$name/"
              7z a -bd "dist/$name.zip" "$name" > /dev/null
            else
              cp "target/$TARGET/release/$bin" "$name/"
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
      - if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  python:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build --all-packages -o dist
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  crates-io:
    needs: [plan, binaries, python]
    environment: ${{ needs.plan.outputs.publish == 'true' && 'crates-io' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # `cargo publish --workspace` needs cargo 1.90+; rust-toolchain.toml pins the MSRV.
      - run: rustup toolchain install stable --profile minimal
      - if: needs.plan.outputs.publish != 'true'
        run: cargo +stable publish --workspace --locked --dry-run
      # crates.io trusted publishing only works for crates that already exist, so the first
      # release uses the CARGO_REGISTRY_TOKEN secret; later ones exchange an OIDC token.
      - if: needs.plan.outputs.publish == 'true' && env.CARGO_REGISTRY_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: needs.plan.outputs.publish == 'true'
        run: cargo +stable publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CARGO_REGISTRY_TOKEN }}

  pypi:
    name: pypi (${{ matrix.package }})
    needs: [plan, binaries, python]
    # PyPI allows one pending trusted publisher per repository, workflow and environment.
    environment: ${{ needs.plan.outputs.publish == 'true' && format('pypi-{0}', matrix.package) || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: epochal-api, files: dist/epochal_api-* }
          - { package: epochal-sandbox, files: dist/epochal_sandbox-* }
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: dist
      - if: needs.plan.outputs.publish != 'true'
        run: uv publish --dry-run --trusted-publishing never ${{ matrix.files }}
      - if: needs.plan.outputs.publish == 'true'
        run: uv publish --trusted-publishing always ${{ matrix.files }}

  github-release:
    needs: [plan, crates-io, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v6
        with:
          name: release-notes
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - if: needs.plan.outputs.publish == 'true'
        run: |
          {
            echo "## All changes"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body \
              | sed 's/^## /### /'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
