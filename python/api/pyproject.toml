[project]
name = "epochal-api"
version = "0.2.0"
description = "Client for the Epochal API. Its time portal serves web search, web fetch and sandboxes held to a past instant."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.4"
authors = [{ name = "Epochal" }]
keywords = ["epochal", "time-portal", "search", "sandbox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://epochal.com"
Repository = "https://github.com/epochal-org/epochal"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epochal"]
