[workspace]
resolver = "3"
members = ["api", "cli", "mcp", "sandbox"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/epochal-org/epochal"
homepage = "https://epochal.com"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
bytesize = "2"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
futures-util = "0.3"
h2 = "0.4"
humantime = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
indicatif = "0.18"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query"] }
rmcp = { version = "3.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
epochal-api = { path = "api", version = "0.2.0" }
epochal-mcp = { path = "mcp", version = "0.2.0" }
epochal-sandbox = { path = "sandbox", version = "0.2.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
