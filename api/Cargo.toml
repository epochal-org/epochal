[package]
name = "epochal-api"
description = "Client for the Epochal API. Its time portal serves web search, web fetch and sandboxes held to a past instant."
version = { workspace = true }
readme = "README.md"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = ["epochal", "time-portal", "search", "sandbox"]
