[package]
name = "epochal-mcp"
description = "MCP server giving an agent Epochal's web search and web fetch, held to a past instant by the time portal."
version = { workspace = true }
readme = "README.md"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = ["epochal", "time-portal", "mcp", "search"]
categories = ["web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "epochal-mcp"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { workspace = true }
serde_json = { workspace = true }
epochal-api = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
